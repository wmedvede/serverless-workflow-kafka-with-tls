apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: sonataflow-node-pool
  labels:
    strimzi.io/cluster: sonataflow-kafka-cluster
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: ephemeral
        kraftMetadata: shared
---
# Naive configuration for the sake of the example. It's not a recommendation for any production system.
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: sonataflow-kafka-cluster
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.0.0
    metadataVersion: 4.0-IV3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
